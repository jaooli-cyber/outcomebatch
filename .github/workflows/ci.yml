name: verify

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: outcomebatch-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.0'

      - name: Install and verify pinned dependencies
        run: make setup

      - name: Verify OutcomeBatch offline
        env:
          REQUIRE_DEMO: '1'
        run: make verify

      - name: Upload deterministic build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fe-016-build-${{ github.sha }}
          path: |
            .build/fe
            .build/ARTIFACT-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
